name: Build Void Internal DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: void-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure DLL
        run: cmake -S . -B build -A x64

      - name: Build only the DLL
        run: cmake --build build --config Release --target void_internal

      - name: Verify DLL output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $PWD 'build/Release/void_internal.dll'
          if (!(Test-Path -LiteralPath $dll)) {
            throw "DLL was not produced: $dll"
          }
          Get-Item -LiteralPath $dll |
            Select-Object Name, Length, FullName |
            Format-List

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: void_internal-dll
          path: build/Release/void_internal.dll
          if-no-files-found: error
          compression-level: 0

      - name: Publish DLL release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Void Internal — Latest DLL
          body: |
            Latest successful Windows x64 DLL build.

            Download: void_internal.dll
          target_commitish: ${{ github.sha }}
          files: build/Release/void_internal.dll
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
