name: Build Void Internal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate Windows app icon from the original logo
        shell: pwsh
        run: ./scripts/Generate-AppIcon.ps1

      - name: Configure native components
        run: cmake -B build -A x64

      - name: Build native components
        run: cmake --build build --config Release

      - name: Publish WinUI 3 application
        run: dotnet publish src/VoidInjector.App/VoidInjector.App.csproj -c Release -r win-x64 --self-contained true -o publish/VoidInjector

      - name: Bundle native module
        shell: pwsh
        run: Copy-Item build/Release/void_internal.dll publish/VoidInjector/void_internal.dll

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Void-Injector-WinUI
          path: publish/VoidInjector/**
